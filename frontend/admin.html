<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>報名名單（主辦方）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>.wrap{max-width:1200px}</style>
</head>
<body>
<div id="app" v-cloak>
<header class="hero">
  <div class="wrap">
    <div class="topbar"><span class="badge">主辦方專用</span></div>
    <h1>澳洲 9 日遊 · 報名名單</h1>
    <p class="sub">資料即時讀取自 Google 試算表。<a v-if="sheetUrl" :href="sheetUrl" target="_blank" rel="noopener" style="color:#fff">開啟試算表 ↗</a></p>
  </div>
</header>

<main class="wrap">
  <section class="card" v-if="!data">
    <div class="f">
      <label class="l" for="tok">管理密碼（Render 上設定的 ADMIN_TOKEN）</label>
      <form class="login" @submit.prevent="load">
        <input type="password" id="tok" v-model="token" autocomplete="current-password">
        <button class="btn primary" :disabled="loading || !token">{{ loading ? '讀取中…' : '登入' }}</button>
      </form>
    </div>
    <p class="status err" v-if="error">{{ error }}</p>
    <p class="hint" v-if="loading">若伺服器剛從休眠中喚醒，第一次可能要等 30–60 秒。</p>
  </section>

  <template v-if="data">
    <div class="stats">
      <div class="stat"><b>{{ data.stats.registrations }}</b><span>報名筆數</span></div>
      <div class="stat"><b>{{ data.stats.travellers }}</b><span>總人數（含同行者）</span></div>
    </div>
    <div class="breakdown">
      <div v-for="g in groups" :key="g.key">
        <h4>{{ g.title }}（以報名人計）</h4>
        <p v-for="(n, code) in data.stats[g.key]" :key="code"><span>{{ label(g.key, code) }}</span><b>{{ n }}</b></p>
        <p v-if="!Object.keys(data.stats[g.key]).length"><span class="hint">—</span></p>
      </div>
    </div>
    <div class="actions" style="margin-top:0">
      <button type="button" class="btn ghost" @click="load">重新整理</button>
      <button type="button" class="btn ghost" @click="copyCsv">複製為 CSV（可貼到 Excel）</button>
      <button type="button" class="btn ghost" @click="logout">登出</button>
      <span class="status">{{ note }}</span>
    </div>
    <div class="tbl">
      <table>
        <thead><tr><th v-for="c in cols" :key="c.h">{{ c.h }}</th></tr></thead>
        <tbody>
          <tr v-if="!data.rows.length"><td :colspan="cols.length">目前還沒有人報名。</td></tr>
          <tr v-for="(r, i) in data.rows" :key="r.id">
            <td v-for="c in cols" :key="c.h" :class="{'wrap-cell': c.wrap}">{{ c.v(r, i) }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </template>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="api.js"></script>
<script src="admin.js"></script>
</body>
</html>
