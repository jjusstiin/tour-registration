# 每次 push 到 main，就把 frontend/ 資料夾發佈到 GitHub Pages
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 把 CSS/JS 網址的 ?v=dev 換成這次 commit 的編號，瀏覽器就會抓新版，不會卡在舊的快取
      - name: Cache-bust asset URLs
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" frontend/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
